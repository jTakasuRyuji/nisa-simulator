<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISA・課税ミックスシミュレータ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; font-size: 24px; color: #2c3e50; margin-bottom: 25px; }
        .input-group { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #edf2f7; }
        .input-container { display: flex; align-items: center; }
        .input-container input { width: 100px; padding: 8px; font-size: 16px; border: 1px solid #cbd5e0; border-radius: 6px; text-align: right; margin-right: 8px; }
        .unit { width: 40px; font-size: 15px; }
        .btn-container { text-align: center; margin-top: 25px; }
        .btn-calc { background-color: #f39c12; color: white; border: none; padding: 14px 80px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; }
        .chart-container { margin-top: 40px; height: 500px; }
        .summary { background: #fdf2e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h1>NISA & 課税シミュレータ</h1>
    
    <div class="summary">
        💡 <b>ルール:</b> 累計元本が1,800万円を超えると、超えた分の投資から発生する利益に対して<b>30%の税金</b>がかかると仮定して計算します。（生涯投資枠のシミュレーション）
    </div>

    <div class="input-group"><label>1. 初期投資額</label><div class="input-container"><input type="number" id="initAsset" value="1070"><span class="unit">万円</span></div></div>
    <div class="input-group"><label>2. 毎月の積立額</label><div class="input-container"><input type="number" id="monthlySum" value="5"><span class="unit">万円</span></div></div>
    <div class="input-group"><label>3. ボーナス時増額 (年2回)</label><div class="input-container"><input type="number" id="bonusSum" value="10"><span class="unit">万円</span></div></div>
    <div class="input-group"><label>4. 期待リターン (年率)</label><div class="input-container"><input type="number" id="returnRate" value="6"><span class="unit">％</span></div></div>
    <div class="input-group"><label>5. 積立期間</label><div class="input-container"><input type="number" id="years" value="25"><span class="unit">年</span></div></div>
    
    <div class="btn-container"><button class="btn-calc" onclick="calculate()">計算する</button></div>
    
    <div class="chart-container"><canvas id="nisaChart"></canvas></div>
</div>

<script>
let nisaChart = null;

function calculate() {
    const initAsset = parseFloat(document.getElementById('initAsset').value) || 0;
    const monthlySum = parseFloat(document.getElementById('monthlySum').value) || 0;
    const bonusSum = parseFloat(document.getElementById('bonusSum').value) || 0;
    const annualRate = (parseFloat(document.getElementById('returnRate').value) || 0) / 100;
    const totalYears = parseInt(document.getElementById('years').value) || 0;
    
    const NISA_LIMIT = 1800; // 1800万円
    const TAX_RATE = 0.30;   // 30%
    const monthlyRate = annualRate / 12;
    
    let currentAsset = initAsset;
    let totalPrincipal = initAsset;
    
    let labels = ['開始'];
    let principalData = [initAsset];
    let netGainData = [0];
    let taxData = [0];
    let limitLine = [NISA_LIMIT];

    for (let y = 1; y <= totalYears; y++) {
        for (let m = 1; m <= 12; m++) {
            currentAsset += monthlySum;
            totalPrincipal += monthlySum;
            if (m === 6 || m === 12) {
                currentAsset += bonusSum;
                totalPrincipal += bonusSum;
            }
            currentAsset *= (1 + monthlyRate);
        }

        // 利益の総額
        let totalGain = currentAsset - totalPrincipal;
        
        // 課税対象となる元本の割合を計算
        // (現在の投資総額のうち、1800万を超えている部分の比率)
        let taxableRatio = 0;
        if (totalPrincipal > NISA_LIMIT) {
            taxableRatio = (totalPrincipal - NISA_LIMIT) / totalPrincipal;
        }

        // 潜在的な税金 = 利益 × 課税元本比率 × 税率
        let potentialTax = totalGain * taxableRatio * TAX_RATE;
        if (potentialTax < 0) potentialTax = 0;

        let netGain = totalGain - potentialTax;

        labels.push(y + '年');
        principalData.push(Math.round(totalPrincipal));
        netGainData.push(Math.round(netGain));
        taxData.push(Math.round(potentialTax));
        limitLine.push(NISA_LIMIT);
    }
    
    draw(labels, principalData, netGainData, taxData, limitLine);
}

function draw(labels, principalData, netGainData, taxData, limitLine) {
    const ctx = document.getElementById('nisaChart').getContext('2d');
    if (nisaChart) nisaChart.destroy();
    
    nisaChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: '潜在的な税金 (30%)',
                    data: taxData,
                    backgroundColor: '#e74c3c', // 赤
                    stack: 'stack1'
                },
                {
                    label: '利益 (手残り)',
                    data: netGainData,
                    backgroundColor: '#2ecc71', // 緑
                    stack: 'stack1'
                },
                {
                    label: '投資元本',
                    data: principalData,
                    backgroundColor: '#bdc3c7', // グレー
                    stack: 'stack1'
                },
                {
                    label: 'NISA枠(1800万)',
                    data: limitLine,
                    type: 'line',
                    borderColor: '#e74c3c',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    fill: false,
                    pointRadius: 0,
                    order: -1 // 最前面に表示
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { stacked: true },
                y: { stacked: true, beginAtZero: true, title: { display: true, text: '万円' } }
            },
            plugins: {
                tooltip: {
                    mode: 'index',
                    intersect: false
                }
            }
        }
    });
}
window.onload = calculate;
</script>
</body>
</html>
