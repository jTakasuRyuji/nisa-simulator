<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISA＆課税口座 AB比較シミュレータ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 20px; }
        .wrapper { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; font-size: 26px; color: #2c3e50; margin-bottom: 20px; }
        
        .global-actions { text-align: center; margin-bottom: 20px; }
        .btn-reset { background-color: #7f8c8d; color: white; border: none; padding: 10px 25px; font-size: 14px; font-weight: bold; border-radius: 20px; cursor: pointer; transition: 0.2s; }
        .btn-reset:hover { background-color: #95a5a6; }

        /* AB並列レイアウト用 */
        .comparison-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .sim-box { flex: 1; min-width: 340px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
        .sim-box.plan-a { border-top: 6px solid #3498db; }
        .sim-box.plan-b { border-top: 6px solid #9b59b6; }
        
        h2 { font-size: 18px; margin-top: 0; margin-bottom: 15px; color: #34495e; display: flex; justify-content: space-between; }
        .plan-a h2 { color: #2980b9; }
        .plan-b h2 { color: #8e44ad; }

        .input-group { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #edf2f7; }
        .input-group label { font-size: 14px; font-weight: 500; color: #4a5568; }
        .input-container { display: flex; align-items: center; }
        .input-container input { width: 90px; padding: 6px; font-size: 15px; border: 1px solid #cbd5e0; border-radius: 6px; text-align: right; margin-right: 6px; }
        .unit { width: 35px; font-size: 14px; color: #718096; }
        
        .btn-container { text-align: center; margin-top: 20px; }
        .btn-calc { color: white; border: none; padding: 12px 50px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; width: 100%; transition: 0.2s; }
        .plan-a .btn-calc { background-color: #3498db; }
        .plan-a .btn-calc:hover { background-color: #2980b9; }
        .plan-b .btn-calc { background-color: #9b59b6; }
        .plan-b .btn-calc:hover { background-color: #8e44ad; }
        
        .chart-container { margin-top: 25px; height: 380px; position: relative; }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>NISA & 課税口座 AB比較シミュレータ</h1>
    
    <div class="global-actions">
        <button class="btn-reset" onclick="resetToDefault()">🔄 初期設定（22歳2万円設定）にリセット</button>
    </div>

    <div class="comparison-container">
        <div class="sim-box plan-a">
            <h2>📊 パターン A</h2>
            <div class="input-group"><label>現在の投資総額 (時価)</label><div class="input-container"><input type="number" id="initAsset_A"><span class="unit">万円</span></div></div>
            <div class="input-group"><label>現在のNISA元本 (累積)</label><div class="input-container"><input type="number" id="initNisaPrincipal_A"><span class="unit">万円</span></div></div>
            <div class="input-group"><label>毎月の積立額</label><div class="input-container"><input type="number" id="monthlySum_A"><span class="unit">万円</span></div></div>
            <div class="input-group"><label>ボーナス時増額 (年2回)</label><div class="input-container"><input type="number" id="bonusSum_A"><span class="unit">万円</span></div></div>
            <div class="input-group"><label>期待リターン (年率)</label><div class="input-container"><input type="number" id="returnRate_A" step="0.1"><span class="unit">％</span></div></div>
            <div class="input-group"><label>今後の運用期間</label><div class="input-container"><input type="number" id="years_A"><span class="unit">年</span></div></div>
            <div class="input-group"><label>課税口座の税率</label><div class="input-container"><input type="number" id="taxRate_A"><span class="unit">％</span></div></div>
            
            <div class="btn-container"><button class="btn-calc" onclick="calculate('A')">A を計算して保存</button></div>
            <div class="chart-container"><canvas id="chart_A"></canvas></div>
        </div>

        <div class="sim-box plan-b">
            <h2>📊 パターン B</h2>
            <div class="input-group"><label>現在の投資総額 (時価)</label><div class="input-container"><input type="number" id="initAsset_B"><span class="unit">万円</span></div></div>
            <div class="input-group"><label>現在のNISA元本 (累積)</label><div class="input-container"><input type="number" id="initNisaPrincipal_B"><span class="unit">万円</span></div></div>
            <div class="input-group"><label>毎月の積立額</label><div class="input-container"><input type="number" id="monthlySum_B"><span class="unit">万円</span></div></div>
            <div class="input-group"><label>ボーナス時増額 (年2回)</label><div class="input-container"><input type="number" id="bonusSum_B"><span class="unit">万円</span></div></div>
            <div class="input-group"><label>期待リターン (年率)</label><div class="input-container"><input type="number" id="returnRate_B" step="0.1"><span class="unit">％</span></div></div>
            <div class="input-group"><label>今後の運用期間</label><div class="input-container"><input type="number" id="years_B"><span class="unit">年</span></div></div>
            <div class="input-group"><label>課税口座の税率</label><div class="input-container"><input type="number" id="taxRate_B"><span class="unit">％</span></div></div>
            
            <div class="btn-container"><button class="btn-calc" onclick="calculate('B')">B を計算して保存</button></div>
            <div class="chart-container"><canvas id="chart_B"></canvas></div>
        </div>
    </div>
</div>

<script>
// グラフオブジェクト保持用
let charts = { A: null, B: null };

// ご指定の「22歳サラリーマン設定」
const DEFAULTS = {
    initAsset: 0,
    initNisaPrincipal: 0,
    monthlySum: 2,
    bonusSum: 0,
    returnRate: 7,
    years: 43, // 65歳 - 22歳 = 43年
    taxRate: 30
};

// 起動時の処理
window.onload = function() {
    loadInputs('A');
    loadInputs('B');
    calculate('A');
    calculate('B');
};

// 指定されたパターンの入力をローカルストレージから読込（無ければデフォルト値）
function loadInputs(suffix) {
    document.getElementById(`initAsset_${suffix}`).value = localStorage.getItem(`initAsset_${suffix}`) ?? DEFAULTS.initAsset;
    document.getElementById(`initNisaPrincipal_${suffix}`).value = localStorage.getItem(`initNisaPrincipal_${suffix}`) ?? DEFAULTS.initNisaPrincipal;
    document.getElementById(`monthlySum_${suffix}`).value = localStorage.getItem(`monthlySum_${suffix}`) ?? DEFAULTS.monthlySum;
    document.getElementById(`bonusSum_${suffix}`).value = localStorage.getItem(`bonusSum_${suffix}`) ?? DEFAULTS.bonusSum;
    document.getElementById(`returnRate_${suffix}`).value = localStorage.getItem(`returnRate_${suffix}`) ?? DEFAULTS.returnRate;
    document.getElementById(`years_${suffix}`).value = localStorage.getItem(`years_${suffix}`) ?? DEFAULTS.years;
    document.getElementById(`taxRate_${suffix}`).value = localStorage.getItem(`taxRate_${suffix}`) ?? DEFAULTS.taxRate;
}

// 入力値をローカルストレージに保存
function saveInputs(suffix) {
    localStorage.setItem(`initAsset_${suffix}`, document.getElementById(`initAsset_${suffix}`).value);
    localStorage.setItem(`initNisaPrincipal_${suffix}`, document.getElementById(`initNisaPrincipal_${suffix}`).value);
    localStorage.setItem(`monthlySum_${suffix}`, document.getElementById(`monthlySum_${suffix}`).value);
    localStorage.setItem(`bonusSum_${suffix}`, document.getElementById(`bonusSum_${suffix}`).value);
    localStorage.setItem(`returnRate_${suffix}`, document.getElementById(`returnRate_${suffix}`).value);
    localStorage.setItem(`years_${suffix}`, document.getElementById(`years_${suffix}`).value);
    localStorage.setItem(`taxRate_${suffix}`, document.getElementById(`taxRate_${suffix}`).value);
}

// 一発リセット処理
function resetToDefault() {
    if (confirm("すべての入力を初期設定（22歳サラリーマン設定）に戻しますか？")) {
        localStorage.clear();
        loadInputs('A');
        loadInputs('B');
        calculate('A');
        calculate('B');
    }
}

// 計算＆描画ロジック
function calculate(suffix) {
    // 保存を実行
    saveInputs(suffix);

    const initAsset = parseFloat(document.getElementById(`initAsset_${suffix}`).value) || 0;
    const initNisaPrincipal = parseFloat(document.getElementById(`initNisaPrincipal_${suffix}`).value) || 0;
    const monthlySum = parseFloat(document.getElementById(`monthlySum_${suffix}`).value) || 0;
    const bonusSum = parseFloat(document.getElementById(`bonusSum_${suffix}`).value) || 0;
    const annualRate = (parseFloat(document.getElementById(`returnRate_${suffix}`).value) || 0) / 100;
    const totalYears = parseInt(document.getElementById(`years_${suffix}`).value) || 0;
    const taxRateInput = (parseFloat(document.getElementById(`taxRate_${suffix}`).value) || 0) / 100;
    
    const NISA_LIMIT = 1800;
    const monthlyRate = annualRate / 12;
    
    let currentAsset = initAsset;
    let totalNisaPrincipal = initNisaPrincipal;
    let totalTaxablePrincipal = 0;
    
    if (initNisaPrincipal > NISA_LIMIT) {
        totalNisaPrincipal = NISA_LIMIT;
        totalTaxablePrincipal = initNisaPrincipal - NISA_LIMIT;
    }
    
    let initialGain = initAsset - initNisaPrincipal;
    if (initialGain < 0) initialGain = 0;

    let labels = ['開始'];
    let principalData = [Math.round(initNisaPrincipal + totalTaxablePrincipal)];
    let netGainData = [Math.round(initialGain)];
    let taxData = [0];
    let limitLine = [NISA_LIMIT];

    for (let y = 1; y <= totalYears; y++) {
        for (let m = 1; m <= 12; m++) {
            let thisMonthInvestment = monthlySum;
            if (m === 6 || m === 12) thisMonthInvestment += bonusSum;
            
            if (totalNisaPrincipal < NISA_LIMIT) {
                let availableNisaSpace = NISA_LIMIT - totalNisaPrincipal;
                if (thisMonthInvestment <= availableNisaSpace) {
                    totalNisaPrincipal += thisMonthInvestment;
                } else {
                    totalNisaPrincipal = NISA_LIMIT;
                    totalTaxablePrincipal += (thisMonthInvestment - availableNisaSpace);
                }
            } else {
                totalTaxablePrincipal += thisMonthInvestment;
            }
            
            currentAsset += thisMonthInvestment;
            currentAsset *= (1 + monthlyRate);
        }

        let cumulativePrincipal = totalNisaPrincipal + totalTaxablePrincipal;
        let totalGain = currentAsset - cumulativePrincipal;
        
        let taxableRatio = 0;
        if (cumulativePrincipal > NISA_LIMIT) {
            taxableRatio = totalTaxablePrincipal / cumulativePrincipal;
        }

        let potentialTax = totalGain * taxableRatio * taxRateInput;
        if (potentialTax < 0) potentialTax = 0;

        let netGain = totalGain - potentialTax;

        labels.push(y + '年');
        principalData.push(Math.round(cumulativePrincipal));
        netGainData.push(Math.round(netGain));
        taxData.push(Math.round(potentialTax));
        limitLine.push(NISA_LIMIT);
    }
    
    const currentTaxPercent = document.getElementById(`taxRate_${suffix}`).value;
    drawChart(suffix, labels, principalData, netGainData, taxData, limitLine, currentTaxPercent);
}

function drawChart(suffix, labels, principalData, netGainData, taxData, limitLine, taxPercent) {
    const ctx = document.getElementById(`chart_${suffix}`).getContext('2d');
    if (charts[suffix]) charts[suffix].destroy();
    
    charts[suffix] = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: '投資元本',
                    data: principalData,
                    backgroundColor: '#bdc3c7',
                    stack: 'stack1'
                },
                {
                    label: '利益 (手残り)',
                    data: netGainData,
                    backgroundColor: '#2ecc71',
                    stack: 'stack1'
                },
                {
                    label: '潜在的な税金 (' + taxPercent + '%)',
                    data: taxData,
                    backgroundColor: '#e74c3c',
                    stack: 'stack1'
                },
                {
                    label: 'NISA枠(1800万)',
                    data: limitLine,
                    type: 'line',
                    borderColor: '#e74c3c',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    fill: false,
                    pointRadius: 0,
                    order: -1
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { stacked: true },
                y: { stacked: true, beginAtZero: true, title: { display: true, text: '万円' } }
            },
            plugins: {
                tooltip: {
                    mode: 'index',
                    intersect: false,
                    itemSort: function(a, b) {
                        return b.datasetIndex - a.datasetIndex;
                    }
                }
            }
        }
    });
}
</script>
</body>
</html>
