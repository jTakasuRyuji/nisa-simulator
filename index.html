<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISA・課税ミックスシミュレータ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; font-size: 24px; color: #2c3e50; margin-bottom: 25px; }
        .input-group { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #edf2f7; }
        .input-container { display: flex; align-items: center; }
        .input-container input { width: 100px; padding: 8px; font-size: 16px; border: 1px solid #cbd5e0; border-radius: 6px; text-align: right; margin-right: 8px; }
        .unit { width: 40px; font-size: 15px; }
        .btn-container { text-align: center; margin-top: 25px; }
        .btn-calc { background-color: #f39c12; color: white; border: none; padding: 14px 80px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; }
        .chart-container { margin-top: 40px; height: 500px; }
        .summary { background: #fdf2e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h1>NISA & 課税口座シミュレータ</h1>
    
    <div class="summary">
        💡 <b>ルール:</b> 投資元本の累計（現在の利用額 ＋ 今後の積立）が1,800万円を超えると、超えた分の投資から発生する利益に対して設定された税率が課税されます。
    </div>

    <div class="input-group"><label>1. 現在の投資総額 (時価評価額)</label><div class="input-container"><input type="number" id="initAsset" value="1070"><span class="unit">万円</span></div></div>
    <div class="input-group"><label>2. 現在のNISA枠 投資元本 (累積)</label><div class="input-container"><input type="number" id="initNisaPrincipal" value="800"><span class="unit">万円</span></div></div>
    
    <div class="input-group"><label>3. 毎月の積立額</label><div class="input-container"><input type="number" id="monthlySum" value="5"><span class="unit">万円</span></div></div>
    <div class="input-group"><label>4. ボーナス時増額 (年2回)</label><div class="input-container"><input type="number" id="bonusSum" value="10"><span class="unit">万円</span></div></div>
    <div class="input-group"><label>5. 期待リターン (年率)</label><div class="input-container"><input type="number" id="returnRate" value="6"><span class="unit">％</span></div></div>
    <div class="input-group"><label>6. 今後の運用期間</label><div class="input-container"><input type="number" id="years" value="25"><span class="unit">年</span></div></div>
    <div class="input-group"><label>7. 課税口座の税率</label><div class="input-container"><input type="number" id="taxRate" value="30"><span class="unit">％</span></div></div>
    
    <div class="btn-container"><button class="btn-calc" onclick="calculate()">計算する</button></div>
    
    <div class="chart-container"><canvas id="nisaChart"></canvas></div>
</div>

<script>
let nisaChart = null;

function calculate() {
    // 画面からの入力値取得
    const initAsset = parseFloat(document.getElementById('initAsset').value) || 0;
    const initNisaPrincipal = parseFloat(document.getElementById('initNisaPrincipal').value) || 0;
    const monthlySum = parseFloat(document.getElementById('monthlySum').value) || 0;
    const bonusSum = parseFloat(document.getElementById('bonusSum').value) || 0;
    const annualRate = (parseFloat(document.getElementById('returnRate').value) || 0) / 100;
    const totalYears = parseInt(document.getElementById('years').value) || 0;
    const taxRateInput = (parseFloat(document.getElementById('taxRate').value) || 0) / 100;
    
    const NISA_LIMIT = 1800; // 1800万円
    const monthlyRate = annualRate / 12;
    
    // シミュレーション用変数
    let currentAsset = initAsset;          // 資産総額（時価）の推移
    let totalNisaPrincipal = initNisaPrincipal; // NISA枠内に入っている元本の推移
    let totalTaxablePrincipal = 0;         // 課税枠（1800万超過後）に入った元本の推移
    
    // 初期状態で既に1800万を超えている特殊ケースのケア
    if (initNisaPrincipal > NISA_LIMIT) {
        totalNisaPrincipal = NISA_LIMIT;
        totalTaxablePrincipal = initNisaPrincipal - NISA_LIMIT;
    }
    
    // 初期状態の利益（時価評価額 - 初期元本）
    let initialGain = initAsset - initNisaPrincipal;
    if (initialGain < 0) initialGain = 0;

    let labels = ['開始'];
    let principalData = [Math.round(initNisaPrincipal + totalTaxablePrincipal)];
    let netGainData = [Math.round(initialGain)];
    let taxData = [0];
    let limitLine = [NISA_LIMIT];

    for (let y = 1; y <= totalYears; y++) {
        for (let m = 1; m <= 12; m++) {
            let thisMonthInvestment = monthlySum;
            if (m === 6 || m === 12) {
                thisMonthInvestment += bonusSum;
            }
            
            // 今月の投資額をNISA枠と課税枠に振り分け
            if (totalNisaPrincipal < NISA_LIMIT) {
                let availableNisaSpace = NISA_LIMIT - totalNisaPrincipal;
                if (thisMonthInvestment <= availableNisaSpace) {
                    totalNisaPrincipal += thisMonthInvestment;
                } else {
                    totalNisaPrincipal = NISA_LIMIT;
                    totalTaxablePrincipal += (thisMonthInvestment - availableNisaSpace);
                }
            } else {
                totalTaxablePrincipal += thisMonthInvestment;
            }
            
            // 月初の投資反映
            currentAsset += thisMonthInvestment;
            // 月末の複利反映
            currentAsset *= (1 + monthlyRate);
        }

        // 全体の累計投資元本
        let cumulativePrincipal = totalNisaPrincipal + totalTaxablePrincipal;
        // 発生している総利益
        let totalGain = currentAsset - cumulativePrincipal;
        
        // 課税対象となる元本の比率（全元本のうち、1800万溢れた元本が占める割合）
        let taxableRatio = 0;
        if (cumulativePrincipal > NISA_LIMIT) {
            taxableRatio = totalTaxablePrincipal / cumulativePrincipal;
        }

        // 潜在的な税金計算
        let potentialTax = totalGain * taxableRatio * taxRateInput;
        if (potentialTax < 0) potentialTax = 0;

        let netGain = totalGain - potentialTax;

        labels.push(y + '年');
        principalData.push(Math.round(cumulativePrincipal));
        netGainData.push(Math.round(netGain));
        taxData.push(Math.round(potentialTax));
        limitLine.push(NISA_LIMIT);
    }
    
    const currentTaxPercent = document.getElementById('taxRate').value;
    draw(labels, principalData, netGainData, taxData, limitLine, currentTaxPercent);
}

function draw(labels, principalData, netGainData, taxData, limitLine, taxPercent) {
    const ctx = document.getElementById('nisaChart').getContext('2d');
    if (nisaChart) nisaChart.destroy();
    
    nisaChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: '投資元本',
                    data: principalData,
                    backgroundColor: '#bdc3c7',
                    stack: 'stack1'
                },
                {
                    label: '利益 (手残り)',
                    data: netGainData,
                    backgroundColor: '#2ecc71',
                    stack: 'stack1'
                },
                {
                    label: '潜在的な税金 (' + taxPercent + '%)',
                    data: taxData,
                    backgroundColor: '#e74c3c',
                    stack: 'stack1'
                },
                {
                    label: 'NISA枠(1800万)',
                    data: limitLine,
                    type: 'line',
                    borderColor: '#e74c3c',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    fill: false,
                    pointRadius: 0,
                    order: -1
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { stacked: true },
                y: { stacked: true, beginAtZero: true, title: { display: true, text: '万円' } }
            },
            plugins: {
                tooltip: {
                    mode: 'index',
                    intersect: false,
                    itemSort: function(a, b) {
                        return b.datasetIndex - a.datasetIndex;
                    }
                }
            }
        }
    });
}
window.onload = calculate;
</script>
</body>
</html>
