<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISA ＆ iDeCo セパレートシミュレータ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 20px; }
        .wrapper { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; font-size: 26px; color: #2c3e50; margin-bottom: 20px; }
        
        .global-actions { text-align: center; margin-bottom: 20px; }
        .btn-reset { background-color: #7f8c8d; color: white; border: none; padding: 10px 25px; font-size: 14px; font-weight: bold; border-radius: 20px; cursor: pointer; }
        .btn-reset:hover { background-color: #95a5a6; }

        /* 左右並列レイアウト（左NISA、右iDeCo） */
        .comparison-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .sim-box { flex: 1; min-width: 450px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
        .sim-box.nisa-side { border-top: 6px solid #3498db; }
        .sim-box.ideco-side { border-top: 6px solid #e67e22; }
        
        h2 { font-size: 20px; margin-top: 0; margin-bottom: 15px; text-align: center; }
        .nisa-side h2 { color: #2980b9; }
        .ideco-side h2 { color: #d35400; }

        .section-title { font-size: 14px; font-weight: bold; color: #7f8c8d; margin: 15px 0 5px 0; border-left: 4px solid #7f8c8d; padding-left: 8px; }

        .input-group { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #edf2f7; }
        .input-group label { font-size: 14px; font-weight: 500; color: #4a5568; }
        .input-container { display: flex; align-items: center; }
        .input-container input { width: 90px; padding: 6px; font-size: 15px; border: 1px solid #cbd5e0; border-radius: 6px; text-align: right; margin-right: 6px; }
        .unit { width: 35px; font-size: 14px; color: #718096; }
        
        .btn-container { text-align: center; margin-top: 20px; }
        .btn-calc { color: white; border: none; padding: 12px 50px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; width: 100%; transition: 0.2s; }
        .nisa-side .btn-calc { background-color: #3498db; }
        .nisa-side .btn-calc:hover { background-color: #2980b9; }
        .ideco-side .btn-calc { background-color: #e67e22; }
        .ideco-side .btn-calc:hover { background-color: #d35400; }
        
        .chart-container { margin-top: 25px; height: 420px; position: relative; }

        .btn-preset { background-color: #16a085; color: white; border: none; padding: 10px 25px; font-size: 14px; font-weight: bold; border-radius: 20px; cursor: pointer; transition: 0.2s; margin-left: 10px; }
        .btn-preset:hover { background-color: #1abc9c; }

        .summary { margin-top: 20px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 18px; }
        .summary h3 { margin: 0 0 10px 0; font-size: 15px; color: #2c3e50; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
        .summary-item { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; border-bottom: 1px dotted #e2e8f0; }
        .summary-item .s-label { color: #4a5568; }
        .summary-item .s-value { font-weight: bold; color: #2c3e50; }
        .summary-item .s-value.net { color: #27ae60; font-size: 16px; }

        .total-summary { margin-top: 20px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 18px 25px; text-align: center; font-size: 16px; color: #2c3e50; }
        .total-summary .grand { color: #27ae60; font-weight: bold; font-size: 19px; }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>NISA ＆ iDeCo 分離シミュレータ</h1>
    
    <div class="global-actions">
        <button class="btn-reset" onclick="resetToDefault()">🔄 初期設定（22歳サラリーマン設定）にリセット</button>
        <button class="btn-preset" onclick="applyTakasuPreset()">📌 自分の設定（52歳・65歳まで）を読み込む</button>
    </div>

    <div class="comparison-container">
        <div class="sim-box nisa-side">
            <h2>📈 NISA 資産推移</h2>
            <div class="section-title">運用条件</div>
            <div class="input-group"><label>今後の運用期間</label><div class="input-container"><input type="number" id="years_NISA"><span class="unit">年</span></div></div>
            <div class="input-group"><label>期待リターン (年率)</label><div class="input-container"><input type="number" id="returnRate_NISA" step="0.1"><span class="unit">％</span></div></div>
            <div class="input-group"><label>枠超過時の税率</label><div class="input-container"><input type="number" id="taxRate_NISA"><span class="unit">％</span></div></div>

            <div class="section-title">現在の資産と積立設定</div>
            <div class="input-group"><label>現在の時価評価額</label><div class="input-container"><input type="number" id="initAsset_NISA"><span class="unit">万円</span></div></div>
            <div class="input-group"><label>現在のNISA元本 (累積)</label><div class="input-container"><input type="number" id="initNisaPrincipal_NISA"><span class="unit">万円</span></div></div>
            <div class="input-group"><label>毎月の積立額</label><div class="input-container"><input type="number" id="monthlySum_NISA"><span class="unit">万円</span></div></div>
            <div class="input-group"><label>ボーナス時増額 (年2回)</label><div class="input-container"><input type="number" id="bonusSum_NISA"><span class="unit">万円</span></div></div>
            
            <div class="btn-container"><button class="btn-calc" onclick="calculateNISA()">NISAを計算して保存</button></div>
            <div class="chart-container"><canvas id="chart_NISA"></canvas></div>
            <div class="summary" id="summary_NISA"></div>
        </div>

        <div class="sim-box ideco-side">
            <h2>💰 iDeCo 資産推移</h2>
            <div class="section-title">運用条件</div>
            <div class="input-group"><label>今後の運用期間</label><div class="input-container"><input type="number" id="years_iDeCo"><span class="unit">年</span></div></div>
            <div class="input-group"><label>期待リターン (年率)</label><div class="input-container"><input type="number" id="returnRate_iDeCo" step="0.1"><span class="unit">％</span></div></div>
            <div class="input-group"><label>出口の想定税率</label><div class="input-container"><input type="number" id="taxRate_iDeCo"><span class="unit">％</span></div></div>

            <div class="section-title">現在の資産と掛金設定</div>
            <div class="input-group"><label>現在の時価評価額</label><div class="input-container"><input type="number" id="initAsset_iDeCo"><span class="unit">万円</span></div></div>
            <div class="input-group"><label>これまでのiDeCo加入年数</label><div class="input-container"><input type="number" id="initYears_iDeCo"><span class="unit">年</span></div></div>
            <div class="input-group"><label>毎月の掛金</label><div class="input-container"><input type="number" id="monthlySum_iDeCo"><span class="unit">万円</span></div></div>
            <div class="input-group"><label style="color:transparent;">ダミー</label><div class="input-container" style="visibility:hidden;"><input type="number"><span class="unit">万円</span></div></div>
            
            <div class="btn-container"><button class="btn-calc" onclick="calculateIDeCo()">iDeCoを計算して保存</button></div>
            <div class="chart-container"><canvas id="chart_iDeCo"></canvas></div>
            <div class="summary" id="summary_iDeCo"></div>
        </div>
    </div>

    <div class="total-summary" id="total_summary"></div>
</div>

<script>
let charts = { NISA: null, iDeCo: null };

// 数値サマリ保持用（合計表示にも使う）
let results = {};

function fmtMan(v) { return Math.round(v).toLocaleString('ja-JP'); }

// 本人プリセット（2026-11時点：52歳→65歳の13年、Money Forward実績ベース）
// NISA = 賞与スポット購入型（賞与の70%を年2回、平均約37.9万円/回）
// iDeCo = 現在の掛金19,000円/月、加入年数は企業型DCとの通算23年
// ※現在のNISA元本は未確認のため、仮に時価と同額（795万円）を置いている
const TAKASU_PRESET = {
    NISA:  { years: 13, returnRate: 4.5, taxRate: 20.315, initAsset: 795, initNisaPrincipal: 795, monthlySum: 0, bonusSum: 37.9 },
    iDeCo: { years: 13, returnRate: 4.5, taxRate: 20, initAsset: 32, initYears: 23, monthlySum: 1.9 }
};

function applyTakasuPreset() {
    if (!confirm("自分の設定（52歳・65歳まで）を読み込みますか？\nNISA = 賞与スポット購入型、iDeCo = 掛金19,000円/月 です。\n※NISA元本は仮置き（時価と同額）です。")) return;
    const n = TAKASU_PRESET.NISA;
    document.getElementById('years_NISA').value = n.years;
    document.getElementById('returnRate_NISA').value = n.returnRate;
    document.getElementById('taxRate_NISA').value = n.taxRate;
    document.getElementById('initAsset_NISA').value = n.initAsset;
    document.getElementById('initNisaPrincipal_NISA').value = n.initNisaPrincipal;
    document.getElementById('monthlySum_NISA').value = n.monthlySum;
    document.getElementById('bonusSum_NISA').value = n.bonusSum;
    const d = TAKASU_PRESET.iDeCo;
    document.getElementById('years_iDeCo').value = d.years;
    document.getElementById('returnRate_iDeCo').value = d.returnRate;
    document.getElementById('taxRate_iDeCo').value = d.taxRate;
    document.getElementById('initAsset_iDeCo').value = d.initAsset;
    document.getElementById('initYears_iDeCo').value = d.initYears;
    document.getElementById('monthlySum_iDeCo').value = d.monthlySum;
    calculateNISA();
    calculateIDeCo();
}

function summaryHTML(title, rows) {
    let html = `<h3>${title}</h3><div class="summary-grid">`;
    rows.forEach(function(r) {
        html += `<div class="summary-item"><span class="s-label">${r[0]}</span><span class="s-value${r[2] ? ' net' : ''}">${r[1]}</span></div>`;
    });
    return html + `</div>`;
}

function renderSummaryNISA() {
    const r = results.NISA;
    if (!r) return;
    document.getElementById('summary_NISA').innerHTML = summaryHTML(`📋 ${r.years}年後の結果（NISA）`, [
        ['評価額（税引前）', fmtMan(r.gross) + ' 万円'],
        ['手残り（税引後）', fmtMan(r.net) + ' 万円', true],
        ['投資元本 合計', fmtMan(r.principal) + ' 万円'],
        ['利益（手残り）', fmtMan(r.netGain) + ' 万円'],
        ['潜在的な税金', fmtMan(r.tax) + ' 万円'],
        ['NISA枠の使用', fmtMan(r.nisaUsed) + ' / 1,800 万円']
    ]);
    renderTotal();
}

function renderSummaryIDeCo() {
    const r = results.iDeCo;
    if (!r) return;
    document.getElementById('summary_iDeCo').innerHTML = summaryHTML(`📋 ${r.years}年後の結果（iDeCo）`, [
        ['評価額（税引前）', fmtMan(r.gross) + ' 万円'],
        ['手残り（出口税引後）', fmtMan(r.net) + ' 万円', true],
        ['掛金 累計', fmtMan(r.principal) + ' 万円'],
        ['利益（税引後）', fmtMan(r.netGain) + ' 万円'],
        ['出口の税金', fmtMan(r.tax) + ' 万円'],
        ['退職所得控除額', fmtMan(r.deduction) + ' 万円']
    ]);
    renderTotal();
}

function renderTotal() {
    const el = document.getElementById('total_summary');
    if (!results.NISA || !results.iDeCo) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    const total = results.NISA.net + results.iDeCo.net;
    if (results.NISA.years === results.iDeCo.years) {
        el.innerHTML = `合計（${results.NISA.years}年後・手残り）： NISA ${fmtMan(results.NISA.net)} 万円 ＋ iDeCo ${fmtMan(results.iDeCo.net)} 万円 ＝ <span class="grand">${fmtMan(total)} 万円</span>`;
    } else {
        el.innerHTML = `手残り合計（期間が異なるため単純合算）： NISA ${fmtMan(results.NISA.net)} 万円（${results.NISA.years}年） ＋ iDeCo ${fmtMan(results.iDeCo.net)} 万円（${results.iDeCo.years}年） ＝ <span class="grand">${fmtMan(total)} 万円</span>`;
    }
}

// デフォルト値（22歳サラリーマン設定）
const DEFAULTS = {
    NISA:  { years: 43, returnRate: 7, taxRate: 30, initAsset: 0, initNisaPrincipal: 0, monthlySum: 2, bonusSum: 0 },
    iDeCo: { years: 43, returnRate: 7, taxRate: 30, initAsset: 0, initYears: 0, monthlySum: 1.2 }
};

window.onload = function() {
    loadInputs('NISA');
    loadInputs('iDeCo');
    calculateNISA();
    calculateIDeCo();
};

function loadInputs(type) {
    if (type === 'NISA') {
        document.getElementById('years_NISA').value = localStorage.getItem('years_NISA') ?? DEFAULTS.NISA.years;
        document.getElementById('returnRate_NISA').value = localStorage.getItem('returnRate_NISA') ?? DEFAULTS.NISA.returnRate;
        document.getElementById('taxRate_NISA').value = localStorage.getItem('taxRate_NISA') ?? DEFAULTS.NISA.taxRate;
        document.getElementById('initAsset_NISA').value = localStorage.getItem('initAsset_NISA') ?? DEFAULTS.NISA.initAsset;
        document.getElementById('initNisaPrincipal_NISA').value = localStorage.getItem('initNisaPrincipal_NISA') ?? DEFAULTS.NISA.initNisaPrincipal;
        document.getElementById('monthlySum_NISA').value = localStorage.getItem('monthlySum_NISA') ?? DEFAULTS.NISA.monthlySum;
        document.getElementById('bonusSum_NISA').value = localStorage.getItem('bonusSum_NISA') ?? DEFAULTS.NISA.bonusSum;
    } else {
        document.getElementById('years_iDeCo').value = localStorage.getItem('years_iDeCo') ?? DEFAULTS.iDeCo.years;
        document.getElementById('returnRate_iDeCo').value = localStorage.getItem('returnRate_iDeCo') ?? DEFAULTS.iDeCo.returnRate;
        document.getElementById('taxRate_iDeCo').value = localStorage.getItem('taxRate_iDeCo') ?? DEFAULTS.iDeCo.taxRate;
        document.getElementById('initAsset_iDeCo').value = localStorage.getItem('initAsset_iDeCo') ?? DEFAULTS.iDeCo.initAsset;
        document.getElementById('initYears_iDeCo').value = localStorage.getItem('initYears_iDeCo') ?? DEFAULTS.iDeCo.initYears;
        document.getElementById('monthlySum_iDeCo').value = localStorage.getItem('monthlySum_iDeCo') ?? DEFAULTS.iDeCo.monthlySum;
    }
}

function saveInputs(type) {
    if (type === 'NISA') {
        localStorage.setItem('years_NISA', document.getElementById('years_NISA').value);
        localStorage.setItem('returnRate_NISA', document.getElementById('returnRate_NISA').value);
        localStorage.setItem('taxRate_NISA', document.getElementById('taxRate_NISA').value);
        localStorage.setItem('initAsset_NISA', document.getElementById('initAsset_NISA').value);
        localStorage.setItem('initNisaPrincipal_NISA', document.getElementById('initNisaPrincipal_NISA').value);
        localStorage.setItem('monthlySum_NISA', document.getElementById('monthlySum_NISA').value);
        localStorage.setItem('bonusSum_NISA', document.getElementById('bonusSum_NISA').value);
    } else {
        localStorage.setItem('years_iDeCo', document.getElementById('years_iDeCo').value);
        localStorage.setItem('returnRate_iDeCo', document.getElementById('returnRate_iDeCo').value);
        localStorage.setItem('taxRate_iDeCo', document.getElementById('taxRate_iDeCo').value);
        localStorage.setItem('initAsset_iDeCo', document.getElementById('initAsset_iDeCo').value);
        localStorage.setItem('initYears_iDeCo', document.getElementById('initYears_iDeCo').value);
        localStorage.setItem('monthlySum_iDeCo', document.getElementById('monthlySum_iDeCo').value);
    }
}

function resetToDefault() {
    if (confirm("すべての入力を初期設定（22歳サラリーマン設定）に戻しますか？")) {
        localStorage.clear();
        loadInputs('NISA'); loadInputs('iDeCo');
        calculateNISA(); calculateIDeCo();
    }
}

// 退職所得控除の計算ロジック（年数連動）
function getRetirementDeduction(totalYears) {
    if (totalYears <= 0) return 0;
    if (totalYears <= 20) return totalYears * 40;
    return 800 + (totalYears - 20) * 70;
}

// 📈 左側：NISAの計算＆描画
function calculateNISA() {
    saveInputs('NISA');
    const years = parseInt(document.getElementById('years_NISA').value) || 0;
    const annualRate = (parseFloat(document.getElementById('returnRate_NISA').value) || 0) / 100;
    const taxRate = (parseFloat(document.getElementById('taxRate_NISA').value) || 0) / 100;
    const initAsset = parseFloat(document.getElementById('initAsset_NISA').value) || 0;
    const initNisaPrincipal = parseFloat(document.getElementById('initNisaPrincipal_NISA').value) || 0;
    const monthlySum = parseFloat(document.getElementById('monthlySum_NISA').value) || 0;
    const bonusSum = parseFloat(document.getElementById('bonusSum_NISA').value) || 0;

    const NISA_LIMIT = 1800;
    const monthlyRate = annualRate / 12;

    let currentAsset = initAsset;
    let totalNisaPrincipal = initNisaPrincipal;
    let totalTaxablePrincipal = 0;

    if (initNisaPrincipal > NISA_LIMIT) {
        totalNisaPrincipal = NISA_LIMIT;
        totalTaxablePrincipal = initNisaPrincipal - NISA_LIMIT;
    }

    let labels = ['開始'];
    let principalData = [Math.round(initNisaPrincipal + totalTaxablePrincipal)];
    let netGainData = [Math.round(Math.max(0, initAsset - initNisaPrincipal))];
    let taxData = [0];
    let limitLine = [NISA_LIMIT];

    for (let y = 1; y <= years; y++) {
        for (let m = 1; m <= 12; m++) {
            let invest = monthlySum;
            if (m === 6 || m === 12) invest += bonusSum;

            if (totalNisaPrincipal < NISA_LIMIT) {
                let space = NISA_LIMIT - totalNisaPrincipal;
                if (invest <= space) { totalNisaPrincipal += invest; } 
                else { totalNisaPrincipal = NISA_LIMIT; totalTaxablePrincipal += (invest - space); }
            } else {
                totalTaxablePrincipal += invest;
            }
            currentAsset += invest;
            currentAsset *= (1 + monthlyRate);
        }

        let cumulativePrincipal = totalNisaPrincipal + totalTaxablePrincipal;
        let totalGain = currentAsset - cumulativePrincipal;
        let taxableRatio = cumulativePrincipal > NISA_LIMIT ? totalTaxablePrincipal / cumulativePrincipal : 0;
        let potentialTax = Math.max(0, totalGain * taxableRatio * taxRate);
        let netGain = totalGain - potentialTax;

        labels.push(y + '年');
        principalData.push(Math.round(cumulativePrincipal));
        netGainData.push(Math.round(netGain));
        taxData.push(Math.round(potentialTax));
        limitLine.push(NISA_LIMIT);
    }

    // 最終年の数値をサマリ用に保持
    let finalPrincipal = totalNisaPrincipal + totalTaxablePrincipal;
    let finalGain = currentAsset - finalPrincipal;
    let finalRatio = finalPrincipal > NISA_LIMIT ? totalTaxablePrincipal / finalPrincipal : 0;
    let finalTax = Math.max(0, finalGain * finalRatio * taxRate);
    results.NISA = {
        years: years,
        gross: currentAsset,
        principal: finalPrincipal,
        netGain: finalGain - finalTax,
        tax: finalTax,
        net: finalPrincipal + (finalGain - finalTax),
        nisaUsed: totalNisaPrincipal
    };
    renderSummaryNISA();

    drawChart('NISA', 'chart_NISA', labels, principalData, netGainData, taxData, limitLine, 'NISA枠(1800万)', '#3498db', document.getElementById('taxRate_NISA').value);
}

// 💰 右側：iDeCoの計算＆描画
function calculateIDeCo() {
    saveInputs('iDeCo');
    const years = parseInt(document.getElementById('years_iDeCo').value) || 0;
    const annualRate = (parseFloat(document.getElementById('returnRate_iDeCo').value) || 0) / 100;
    const taxRate = (parseFloat(document.getElementById('taxRate_iDeCo').value) || 0) / 100;
    const initAsset = parseFloat(document.getElementById('initAsset_iDeCo').value) || 0;
    const initYears = parseInt(document.getElementById('initYears_iDeCo').value) || 0;
    const monthlySum = parseFloat(document.getElementById('monthlySum_iDeCo').value) || 0;

    const monthlyRate = annualRate / 12;

    let currentAsset = initAsset;
    let totalPrincipal = initAsset; // 掛金累計

    let labels = ['開始'];
    let principalData = [Math.round(totalPrincipal)];
    let netGainData = [0];
    let taxData = [0];
    let deductionLine = [getRetirementDeduction(initYears)];

    for (let y = 1; y <= years; y++) {
        let currentTotalYears = initYears + y;

        for (let m = 1; m <= 12; m++) {
            currentAsset += monthlySum;
            totalPrincipal += monthlySum;
            currentAsset *= (1 + monthlyRate);
        }

        // iDeCo出口税制：(受取総額 - 退職所得控除) * 0.5 * 税率
        let deduction = getRetirementDeduction(currentTotalYears);
        let potentialTax = 0;
        if (currentAsset > deduction) {
            potentialTax = (currentAsset - deduction) * 0.5 * taxRate;
        }

        let totalGain = currentAsset - totalPrincipal;
        let netGain = totalGain - potentialTax;

        labels.push(y + '年');
        principalData.push(Math.round(totalPrincipal));
        netGainData.push(Math.round(netGain));
        taxData.push(Math.round(potentialTax));
        deductionLine.push(Math.round(deduction));
    }

    // 最終年の数値をサマリ用に保持（出口税制は最終年の加入年数で再計算）
    let finalDeduction = getRetirementDeduction(initYears + years);
    let finalTax = currentAsset > finalDeduction ? (currentAsset - finalDeduction) * 0.5 * taxRate : 0;
    let finalGain = currentAsset - totalPrincipal;
    results.iDeCo = {
        years: years,
        gross: currentAsset,
        principal: totalPrincipal,
        netGain: finalGain - finalTax,
        tax: finalTax,
        net: currentAsset - finalTax,
        deduction: finalDeduction
    };
    renderSummaryIDeCo();

    drawChart('iDeCo', 'chart_iDeCo', labels, principalData, netGainData, taxData, deductionLine, '退職所得控除額', '#e67e22', document.getElementById('taxRate_iDeCo').value);
}

// 共通グラフ描画関数
function drawChart(type, canvasId, labels, principalData, netGainData, taxData, lineData, lineLabel, lineColor, taxPercent) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    if (charts[type]) charts[type].destroy();
    
    charts[type] = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                { label: '投資元本', data: principalData, backgroundColor: '#bdc3c7', stack: 'stack1' },
                { label: '利益 (手残り)', data: netGainData, backgroundColor: '#2ecc71', stack: 'stack1' },
                { label: '潜在的な税金 (' + taxPercent + '%)', data: taxData, backgroundColor: '#e74c3c', stack: 'stack1' },
                {
                    label: lineLabel,
                    data: lineData,
                    type: 'line',
                    borderColor: lineColor,
                    borderWidth: 2,
                    borderDash: [5, 5],
                    fill: false,
                    pointRadius: 0,
                    order: -1
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { stacked: true },
                y: { stacked: true, beginAtZero: true, title: { display: true, text: '万円' } }
            },
            plugins: { tooltip: { mode: 'index', intersect: false, itemSort: (a, b) => b.datasetIndex - a.datasetIndex } }
        }
    });
}
</script>
